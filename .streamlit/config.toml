# Corporate theming per the PO's UI style guide: neutral base, single green
# accent. Both light and dark palettes are defined, so the viewer's
# System / Light / Dark choice in the app menu works and stays on-brand.

[theme.light]
primaryColor = "#1B7F4B"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F1F3F5"
textColor = "#1F2933"
linkColor = "#1B7F4B"

[theme.dark]
primaryColor = "#3ECF8E"
backgroundColor = "#12161C"
secondaryBackgroundColor = "#1B222B"
textColor = "#E5E9EE"
linkColor = "#3ECF8E"
borderColor = "#2A323D"
